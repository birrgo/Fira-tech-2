<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OneSignal Push Sender</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans p-6">

    <div class="max-w-3xl mx-auto bg-white p-8 rounded-lg shadow-md">
        <h2 class="text-2xl font-bold text-blue-900 mb-6 border-b pb-2">Send Push Notification</h2>
        
        <form id="pushForm" class="space-y-6">
            
            <!-- Notification Content -->
            <div>
                <h3 class="text-lg font-semibold text-gray-700 mb-3">1. Message Details</h3>
                <div class="mb-4">
                    <label class="block text-sm font-medium mb-1">Notification Title</label>
                    <input type="text" id="pushTitle" required class="w-full border border-gray-300 px-3 py-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="e.g., New Update Available!">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium mb-1">Message Body</label>
                    <textarea id="pushMessage" rows="3" required class="w-full border border-gray-300 px-3 py-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="e.g., Check out the latest features in the app."></textarea>
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium mb-1">Image URL (Optional)</label>
                    <input type="url" id="imageUrl" class="w-full border border-gray-300 px-3 py-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="https://example.com/image.jpg">
                    <p class="text-xs text-gray-500 mt-1">Displays as a large image (Big Picture) on Android devices.</p>
                </div>
            </div>

            <!-- OneSignal Credentials -->
            <div class="bg-blue-50 p-4 rounded border border-blue-100">
                <h3 class="text-lg font-semibold text-blue-900 mb-3">2. OneSignal Credentials</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium mb-1">OneSignal App ID</label>
                        <input type="text" id="osAppId" required class="w-full border border-gray-300 px-3 py-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">OneSignal REST API Key</label>
                        <input type="password" id="osRestKey" required class="w-full border border-gray-300 px-3 py-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>
                <p class="text-xs text-gray-500 mt-2">*Keys are saved locally in your browser so you don't have to type them every time.</p>
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white font-bold py-3 rounded hover:bg-blue-700 transition duration-200">
                Send Push Notification
            </button>
            
            <div id="statusMessage" class="hidden mt-4 p-3 rounded font-medium text-center border"></div>
        </form>
    </div>

    <script>
        // Load saved OneSignal keys from localStorage
        document.getElementById('osAppId').value = localStorage.getItem('osAppId') || '';
        document.getElementById('osRestKey').value = localStorage.getItem('osRestKey') || '';

        const statusDiv = document.getElementById('statusMessage');
        const submitBtn = document.getElementById('submitBtn');

        function showStatus(message, isError = false) {
            statusDiv.classList.remove('hidden', 'bg-green-50', 'text-green-800', 'border-green-200', 'bg-red-50', 'text-red-800', 'border-red-200');
            
            if (isError) {
                statusDiv.classList.add('bg-red-50', 'text-red-800', 'border-red-200');
            } else {
                statusDiv.classList.add('bg-green-50', 'text-green-800', 'border-green-200');
            }
            
            statusDiv.innerText = message;
        }

        document.getElementById('pushForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.innerText = "Sending...";
            statusDiv.classList.add('hidden');

            const title = document.getElementById('pushTitle').value;
            const message = document.getElementById('pushMessage').value;
            const imageUrl = document.getElementById('imageUrl').value;
            
            const osAppId = document.getElementById('osAppId').value;
            const osRestKey = document.getElementById('osRestKey').value;

            // Save keys for future use
            localStorage.setItem('osAppId', osAppId);
            localStorage.setItem('osRestKey', osRestKey);

            try {
                const response = await fetch("https://onesignal.com/api/v1/notifications", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json; charset=utf-8",
                        "Authorization": `Basic ${osRestKey}`
                    },
                    body: JSON.stringify({
                        app_id: osAppId,
                        included_segments: ["Subscribed Users"],
                        headings: { "en": title },
                        contents: { "en": message },
                        big_picture: imageUrl || undefined
                    })
                });

                const result = await response.json();

                if (response.ok && result.id) {
                    showStatus("Success! Push Notification sent to all users.");
                    document.getElementById('pushTitle').value = '';
                    document.getElementById('pushMessage').value = '';
                    document.getElementById('imageUrl').value = '';
                } else {
                    console.error(result);
                    showStatus(`Failed: ${result.errors ? result.errors.join(', ') : 'Unknown error. Check your API Keys.'}`, true);
                }

            } catch (error) {
                console.error(error);
                showStatus(`Network Error: ${error.message}`, true);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "Send Push Notification";
            }
        });
    </script>
</body>
</html>
